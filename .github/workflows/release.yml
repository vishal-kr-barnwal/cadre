name: Release
run-name: Release - ${{ github.event.release.tag_name || github.ref_name }}

on:
  push:
    tags: ['beta-*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-cadre-ai
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish NPM package
    if: github.event_name == 'push' || (!github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'beta-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify version and select npm channel
        id: release
        working-directory: harness
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: node --import tsx scripts/release-channel.ts
      - name: Check harness package
        run: pnpm --filter cadre-ai check
      - name: Test harness package
        run: pnpm --filter cadre-ai test
      - name: Validate harness package
        run: pnpm --filter cadre-ai validate
      - name: Pack dry-run
        run: pnpm --filter cadre-ai pack --dry-run
      - name: Publish cadre-ai
        working-directory: harness
        env:
          NPM_CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm publish --access public --provenance --tag "$NPM_CHANNEL"
      - name: Verify published version and channel
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NPM_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "cadre-ai@$NPM_CHANNEL" version 2>/dev/null)" || published=""
            if [ "$published" = "$RELEASE_VERSION" ]; then exit 0; fi
            echo "Waiting for npm registry visibility (attempt $attempt/6)"
            sleep 10
          done
          echo "Published version was not visible on the expected npm channel" >&2
          exit 1

  docs:
    name: Run docs pipeline
    needs: publish-npm
    if: github.event_name == 'release' && !github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'beta-')
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.ref_name }}
      production_branch: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || 'main' }}
    secrets: inherit
